version: '3.8'

services:
  asc_database:
    build: ./
    container_name: asc_database
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: asc_database
    ports:
      - "5454:5432"

#  zookeeper:
#      image: confluentinc/cp-zookeeper:7.2.1
#      container_name: zookeeper
#      environment:
#        ZOOKEEPER_CLIENT_PORT: 2181
#        ZOOKEEPER_TICK_TIME: 2000
#      ports:
#        - "2181:2181"
#
#  kafka:
#    image: confluentinc/cp-kafka:7.2.1
#    container_name: kafka
#    depends_on:
#      - zookeeper
#    ports:
#      - "9092:9092"
#    environment:
#      KAFKA_BROKER_ID: 1
#      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
#      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
#      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
#      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
#
#volumes:
#  pgdata:

  # зукипер для кафки
  zookeeper:
    image: zookeeper:latest
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  # кафка
  kafka:
    container_name: kafka
    image: wurstmeister/kafka
    platform: linux/amd64
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9090,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9090,EXTERNAL://127.0.0.1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
    volumes:
      - ./kafka-data:/var/lib/kafka
    command: ""
    restart: unless-stopped

  # создание топиков, если топиков не существует, после docker compose up -d и создания всех топиков
  # можно закомментировать после первого запуска, что бы в дальнейшем контейнер не запускался
  kafka-init:
    image: wurstmeister/kafka
    depends_on:
      - kafka
      - zookeeper
    platform: linux/amd64
    entrypoint: >
      bash -c "
      sleep 20 && \
      (kafka-topics.sh --zookeeper zookeeper:2181 --list | grep -q pay-create || kafka-topics.sh --zookeeper zookeeper:2181 --create --topic PAY.IN --partitions 1 --replication-factor 1) && \
      (kafka-topics.sh --zookeeper zookeeper:2181 --list | grep -q payment-result || kafka-topics.sh --zookeeper zookeeper:2181 --create --topic PAY.OUT --partitions 1 --replication-factor 1) && \
      (kafka-topics.sh --zookeeper zookeeper:2181 --list | grep -q notification-send || kafka-topics.sh --zookeeper zookeeper:2181 --create --topic NOTIFY.IN --partitions 1 --replication-factor 1)
      "

  services:
    app:
      build:
        context: .
        dockerfile: Dockerfile
      image: my_app_image
      ports:
        - "8080:8080"
      depends_on:
        - db
    db:
      image: postgres:latest
      environment:
        POSTGRES_DB: database_asc
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
      ports:
        - "5433:5432"

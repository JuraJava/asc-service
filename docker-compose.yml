version: '3.8'

services:
  auth-service:
    build:
      context: ./auth-service
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - JWT_SECRET=yourSecretKeyHere
    networks:
      - backend

  asc-service:
    build:
      context: ./asc-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - JWT_SECRET=yourSecretKeyHere
      - AUTH_SERVICE_URL=http://auth-service:8080
    depends_on:
      - auth-service
    networks:
      - backend

networks:
  backend:
    driver: bridge

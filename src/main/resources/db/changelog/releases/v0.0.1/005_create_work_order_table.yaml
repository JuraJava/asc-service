databaseChangeLog:
  - changeSet:
      id: 005-create-work-order
      author: Yuri Danilov
      changes:
        - createTable:
            tableName: work_order
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
                  autoIncrement: true
              - column:
                  name: id_repair_request
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_work_order_repair
                    referencedTableName: repair_request
                    referencedColumnNames: id
              - column:
                  name: date_creation_work_order
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: repair_status
                  type: VARCHAR(48)
                  constraints:
                    nullable: false
              - column:
                  name: payment_status
                  type: VARCHAR(48)
                  constraints:
                    nullable: false
              - column:
                  name: cost_replaced_part
                  type: DECIMAL(8,2)
                  constraints:
                    nullable: true
              - column:
                  name: cost_performed_work
                  type: DECIMAL(8,2)
                  constraints:
                    nullable: false
              - column:
                  name: total_cost_work_order
                  type: DECIMAL(8,2)
                  constraints:
                    nullable: false
              - column:
                  name: salary_for_this_order
                  type: DECIMAL(8,2)
                  constraints:
                    nullable: false
              - column:
                  name: id_employee_who_performed
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_work_order_employee
                    referencedTableName: employee
                    referencedColumnNames: id
              - column:
                  name: date_completion_repair
                  type: TIMESTAMP
                  constraints:
                    nullable: true
              - column:
                  name: description
                  type: VARCHAR(128)
                  constraints:
                    nullable: true

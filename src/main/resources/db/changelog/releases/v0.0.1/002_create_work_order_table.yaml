databaseChangeLog:
  - changeSet:
      id: 002-create-work-order
      author: Yuri Danilov
      changes:
        - createTable:
            tableName: work_order
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    autoIncrement: true
                    primaryKey: true
                    nullable: false
              - column:
                  name: id_repair_request
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_work_order_repair
                    referencedTableName: repair_request
                    referencedColumnNames: id
              - column:
                  name: date_of_creation_work_order
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: repair_status
                  type: VARCHAR(48)
                  constraints:
                    nullable: false
              - column:
                  name: payment_status
                  type: VARCHAR(48)
                  constraints:
                    nullable: false
              - column:
                  name: name_of_completed_work
                  type: VARCHAR(48)
                  constraints:
                    nullable: false
              - column:
                  name: batch_number_replaced_spare_part
                  type: VARCHAR(48)
                  constraints:
                    nullable: true
              - column:
                  name: cost_of_spare_part
                  type: DECIMAL(8,2)
                  constraints:
                    nullable: true
              - column:
                  name: cost_of_work_performed
                  type: DECIMAL(8,2)
                  constraints:
                    nullable: false
              - column:
                  name: cost_of_additional_work_performed
                  type: DECIMAL(8,2)
                  constraints:
                    nullable: true
              - column:
                  name: total_cost_of_work_order
                  type: DECIMAL(8,2)
                  constraints:
                    nullable: false
              - column:
                  name: salary_for_employee_on_this_order
                  type: DECIMAL(8,2)
                  constraints:
                    nullable: false
              - column:
                  name: id_of_employee_who_performed_repair
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_work_order_employee
                    referencedTableName: employee
                    referencedColumnNames: id
              - column:
                  name: date_of_completion_of_repair
                  type: TIMESTAMP
                  constraints:
                    nullable: true

databaseChangeLog:
  - changeSet:
      id: 004-create-employee
      author: Yuri Danilov
      changes:
        - createTable:
            tableName: employee
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    autoIncrement: true
                    primaryKey: true
                    nullable: false
              - column:
                  name: last_name_first_name_of_employee
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: patronymic_of_employee
                  type: VARCHAR(48)
                  constraints:
                    nullable: true
              - column:
                  name: role_of_employee
                  type: VARCHAR(24)
                  constraints:
                    nullable: false
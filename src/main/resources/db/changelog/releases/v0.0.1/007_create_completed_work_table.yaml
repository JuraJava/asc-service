databaseChangeLog:
  - changeSet:
      id: 007-create-completed-work
      author: Yuri Danilov
      changes:
        - createTable:
            tableName: completed_work
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
                  autoIncrement: true
              - column:
                  name: name_work
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: cost_work
                  type: DECIMAL(8,2)
                  constraints:
                    nullable: false

databaseChangeLog:
  - changeSet:
      id: 005-create-payment-transactions
      author: Yuri Danilov
      changes:
        - createTable:
            tableName: payment_transactions
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    autoIncrement: true
                    primaryKey: true
                    nullable: false
              - column:
                  name: amount
                  type: DECIMAL(8,2)
                  constraints:
                    nullable: false
              - column:
                  name: type_payment
                  type: VARCHAR(16)
                  constraints:
                    nullable: false
              - column:
                  name: currency
                  type: VARCHAR(3)
                  constraints:
                    nullable: false
              - column:
                  name: executed_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: id_employee_who_accepted_payment
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_payment_employee
                    referencedTableName: employee
                    referencedColumnNames: id

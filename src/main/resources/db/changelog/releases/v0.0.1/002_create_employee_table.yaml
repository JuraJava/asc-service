databaseChangeLog:
  - changeSet:
      id: 002-create-employee
      author: Yuri Danilov
      changes:
        - createTable:
            tableName: employee
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
                  autoIncrement: true
              - column:
                  name: full_name_employee
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: patronymic
                  type: VARCHAR(48)
                  constraints:
                    nullable: true
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: role
                  type: VARCHAR(24)
                  constraints:
                    nullable: false
              - column:
                  name: share_of_completed_work
                  type: FLOAT
                  remarks: "Employee's share of the cost of the work performed"
                  constraints:
                    nullable: true

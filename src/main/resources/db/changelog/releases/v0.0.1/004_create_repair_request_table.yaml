databaseChangeLog:
  - changeSet:
      id: 003-create-repair-request
      author: Yuri Danilov
      changes:
        - createTable:
            tableName: repair_request
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
                  autoIncrement: true
              - column:
                  name: date_creation
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: type_repair
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: request_status
                  type: VARCHAR(48)
                  constraints:
                    nullable: false
              - column:
                  name: device_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_repair_device
                    referencedTableName: device
                    referencedColumnNames: id
              - column:
                  name: id_service_center
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_repair_service_center
                    referencedTableName: service_center
                    referencedColumnNames: id
              - column:
                  name: serial_number
                  type: VARCHAR(16)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: date_sale
                  type: DATE
                  constraints:
                    nullable: true
              - column:
                  name: reported_defect
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: device_appearance
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: full_name_consumer
                  type: VARCHAR(96)
                  constraints:
                    nullable: false
              - column:
                  name: patronymic_consumer
                  type: VARCHAR(48)
                  constraints:
                    nullable: true
              - column:
                  name: address_consumer
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: phone_number_consumer
                  type: VARCHAR(16)
                  constraints:
                    nullable: false
              - column:
                  name: id_employee_who_accepted
                  type: BIGINT
                  remarks: "This is the id of the employee who accepted the repair request"
                  constraints:
                    nullable: false
                    foreignKeyName: fk_repair_employee
                    referencedTableName: employee
                    referencedColumnNames: id

databaseChangeLog:
  - changeSet:
      id: 006-create-spare-part
      author: Yuri Danilov
      changes:
        - createTable:
            tableName: spare_part
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
                  autoIncrement: true
              - column:
                  name: batch_number_part
                  type: VARCHAR(16)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: remaining_quantity
                  type: BIGINT
                  constraints:
                    nullable: true
              - column:
                  name: cost_spare_part
                  type: DECIMAL(8,2)
                  constraints:
                    nullable: false
              - column:
                  name: device_id
                  type: BIGINT
                  remarks: "This is the id of the device for which this spare part is used"
                  constraints:
                    nullable: true

databaseChangeLog:
  - changeSet:
      id: 005-create-spare-part
      author: Yuri Danilov
      changes:
        - createTable:
            tableName: spare_part
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    autoIncrement: true
                    primaryKey: true
                    nullable: false
              - column:
                  name: batch_number_spare_part
                  type: VARCHAR(16)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: number_of_remaining_spare_part
                  type: BIGINT
                  constraints:
                    nullable: true
              - column:
                  name: cost_of_spare_part
                  type: DECIMAL(8,2)
                  constraints:
                    nullable: false
              - column:
                  name: id_of_device_for_which_spare_part_is_use
                  type: BIGINT
                  constraints:
                    nullable: false
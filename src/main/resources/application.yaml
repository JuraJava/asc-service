server:
  port: ${PORT:8081}
jwt:
  secret: ${JWT_ACCESS_SECRET:"luAUigPkQylTDBN0J58GVnKVgfhi+T2oOitIk6u8/HqGVBOxuJFANQD5OHPVKHdxsdxIUiNyIRh18PvzCCdGRQ=="}
spring:
  application.name: asc-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5454/asc_database?currentSchema=asc_service}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: ${APP_POSTGRESQL_SCHEMA:asc_service}
    database: postgresql
    show-sql: true
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/releases/db.changelog-master.yaml
    default_schema: ${APP_POSTGRESQL_SCHEMA:asc_service}
  jackson:
    deserialization:
      fail-on-unknown-properties: true

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: asc-service-response-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    admin:
      properties:
        bootstrap.servers: localhost:9092


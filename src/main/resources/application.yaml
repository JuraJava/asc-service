scheduler:
  outbox:
    fixed-delay-ms: 300000  # 5 минут
outbox:
  partition:
    retention-days: 30

eureka:
  client:
    enabled: ${EUREKA_ENABLED:false} # Флаг для включения/выключения
app:
  init-data: false

logging:
  level:
    com.yurdan.ascService: INFO
report:
  service:
    url: ${REPORT_SERVICE_URL:http://localhost:8083/report/logs}

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: ${APP_POSTGRESQL_SCHEMA:asc_service}
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/releases/db.changelog-master.yaml
    default_schema: ${APP_POSTGRESQL_SCHEMA:asc_service}
  jackson:
    deserialization:
      fail-on-unknown-properties: true
